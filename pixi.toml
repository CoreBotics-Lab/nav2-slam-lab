[workspace]
name = "nav2_slam_lab"
version = "0.1.0"
channels = ["https://prefix.dev/robostack-lyrical", "conda-forge"]
platforms = ["linux-64"]

[activation]
scripts = ["bash_scripts/setup_env.sh"]

[activation.env]
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
QT_QPA_PLATFORM = "xcb"
QT_SCREEN_SCALE_FACTORS = "1"
QT_ENABLE_HIGHDPI_SCALING = "0"
QT_SCALE_FACTOR = "1"
FONTCONFIG_PATH = "/etc/fonts"
FONTCONFIG_FILE = "/etc/fonts/fonts.conf"

[tasks]
build = "bash bash_scripts/build.sh"
clean = "bash bash_scripts/build.sh clean"
test = "colcon test"
kill-gz = "killall -9 gz-sim-main gz-sim-gui-client 2>/dev/null || true"

[dependencies]
ros-lyrical-desktop = "*"
ros-lyrical-xacro = "*"
ros-lyrical-urdf = "*"
ros-lyrical-tf-transformations = "*"
ros-lyrical-joint-state-publisher-gui = "*"
ros-lyrical-robot-state-publisher = "*"
ros-lyrical-ros-gz-sim = "*"
ros-lyrical-ros-gz-bridge = "*"
ros-lyrical-navigation2 = "*"
ros-lyrical-nav2-bringup = "*"
ros-lyrical-nav2-simple-commander = "*"
ros-lyrical-slam-toolbox = "*"
ros-lyrical-robot-localization = "*"
ros-lyrical-rmw-cyclonedds-cpp = "*"
qt6-main = "*"
colcon-common-extensions = "*"
compilers = "*"
cmake = "*"
ninja = "*"
